
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de colorimetría</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Análisis de colorimetría</h1>
        <p>Cargá una fotografía para comenzar el análisis.</p>

        <section class="upload-section">
            <label for="imageInput">Seleccionar fotografía:</label>
            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg, image/webp, image/bmp"
            >
        </section>        
    </main>

<section class="preview-section">
    <h2>Vista previa</h2>

    <div id="imageContainer">
        <p id="placeholder">Todavía no seleccionaste una imagen.</p>

        <div id="imageWrapper">
            <img id="imagePreview" alt="Fotografía seleccionada">
            <div id="markers"></div>
        </div>
    </div>
</section>

<section class="selection-section">
    <h2>Seleccionar colores</h2>

    <p>Elegí una característica y luego hacé clic sobre la fotografía.</p>

    <button type="button" data-part="skin">Seleccionar piel</button>
    <button type="button" data-part="eyes">Seleccionar ojos</button>
    <button type="button" data-part="hair">Seleccionar cabello</button>

    <p id="selectionStatus">Todavía no seleccionaste ningún punto.</p>
</section>


<button type="button" id="analyzeButton">
    Analizar fotografía
</button>

<section id="analysisResult" class="analysis-result" aria-live="polite">
</section>

    <script src="app.js"></script>
</body>
</html>
